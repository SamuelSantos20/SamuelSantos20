name: Atualizar estatísticas do perfil

on:
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/generate_github_stats.py"
      - ".github/workflows/update-profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar cartões
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          STATS_REPOSITORIES: library-api,time-sheet,financas-municipais-baixada,game_synopsis,Stock_Management_System,amparo-hub
        run: python scripts/generate_github_stats.py

      - name: Publicar atualização
        run: |
          if git diff --quiet -- assets/github-stats.svg assets/github-languages-bars.svg; then
            echo "As estatísticas já estão atualizadas."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-languages-bars.svg
          git commit -m "Atualiza estatísticas do GitHub"
          git push
